<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Shift Schedule - February 2024</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tooltip {
            visibility: hidden;
            position: absolute;
            z-index: 1;
            background-color: #333;
            color: #fff;
            text-align: center;
            padding: 5px;
            border-radius: 6px;
            font-size: 12px;
        }
    </style>
</head>
<body class="min-h-screen bg-white p-4">
    <div class="max-w-[95rem] mx-auto">
        <header class="mb-6">
            <h1 class="text-2xl font-bold text-gray-900">Team Shift Schedule - February 2024</h1>
            <p class="text-sm text-gray-600">All times are in IST (India Standard Time)</p>
        </header>

        <div class="overflow-x-auto">
            <table class="min-w-full border border-gray-200">
                <thead>
                    <tr class="bg-gray-50">
                        <th class="border border-gray-200 px-4 py-2 text-left font-semibold text-gray-900 sticky left-0 bg-gray-50 z-10">Employee</th>
                    </tr>
                </thead>
                <tbody id="scheduleBody"></tbody>
            </table>
        </div>

        <div id="legend" class="mt-6 grid grid-cols-2 md:grid-cols-4 lg:grid-cols-8 gap-4"></div>
    </div>

    <div id="tooltip" class="tooltip"></div>

    <script>
        const schedule = [
            { name: "Reshma", shifts: ["W","1","L","L","1","1","W","W","U","U","U","U","U","W","W","1","1","L","1","1","W","W","1","1","1","1","1","W"] },
            { name: "Srihari", shifts: ["W","1","1","1","1","1","W","W","1","1","1","1","1","W","W","1","1","1","1","1","W","W","1","1","1","1","1","W"] },
            { name: "Lokesh", shifts: ["W","1","1","1","1","1","W","W","1","1","1","L","1","W","W","2","2","2","2","2","W","W","3","3","3","3","3","W"] },
            { name: "Arko", shifts: ["W","3","3","3","3","3","W","W","2","2","2","2","2","W","W","2","2","2","2","L","W","W","2","2","2","2","2","W"] },
            { name: "Sai Krishna", shifts: ["W","3","3","2","2","2","W","W","3","2","2","1","1","W","W","1","L","1","1","1","W","W","3","3","2","L","L","W"] },
            { name: "Amey", shifts: ["3","W","W","1","1","1","1","1","W","W","1","1","1","L","L","W","W","1","1","3","3","3","W","W","1","1","1","3"] },
            { name: "Swapna", shifts: ["1","W","W","U","U","U","U","U","W","W","1","1","1","L","1","W","W","L","1","1","1","1","W","W","1","1","1","L"] },
            { name: "Sakshi", shifts: ["G","W","W","2","2","2","2","2","W","W","L","L","L","1","G","W","W","3","3","3","3","3","W","W","2","2","2","2"] },
            { name: "Rishav", shifts: ["1","W","W","1","1","1","1","1","W","W","3","3","3","3","3","W","W","L","1","1","1","1","W","W","L","1","1","1"] },
            { name: "Niharika", shifts: ["2","W","W","2","2","2","2","2","W","W","1","1","1","1","1","W","W","2","L","2","L","2","W","W","3","3","3","3"] },
            { name: "Venkatesh B", shifts: ["3","W","W","1","1","1","1","1","W","W","2","2","2","2","2","W","W","L","L","L","G","G","W","W","1","1","1","1"] },
            { name: "Sujaya", shifts: ["2","L","L","2","W","W","2","G","2","L","L","L","L","L","W","W","2","2","2","G","G","W","W","1","1","1","1","1"] },
            { name: "Sruthi", shifts: ["L","2","2","W","W","2","3","3","3","3","W","W","2","2","2","2","U","W","W","2","2","2","2","2","W","W","2","2"] },
            { name: "Kotti", shifts: ["W","W","1","1","1","1","1","W","W","L","2","2","2","G","W","W","1","1","1","1","1","W","W","1","1","1","1","1"] },
            { name: "Monica", shifts: ["W","W","2","2","2","2","2","W","W","2","L","2","2","U","U","W","W","2","2","2","2","2","W","W","2","2","2","2"] },
            { name: "Vignesh", shifts: ["W","2","2","2","2","2","W","W","L","L","2","2","2","W","W","3","3","3","3","3","W","W","2","2","2","2","2","W"] },
            { name: "Faizan", shifts: ["W","2","2","2","L","2","W","W","2","G","2","2","2","W","W","U","U","U","U","U","W","W","2","2","2","2","2","W"] },
            { name: "Shashikant", shifts: ["1","W","W","2","2","2","2","2","W","W","U","U","U","U","3","W","W","2","2","2","2","3","W","W","2","2","2","2"] },
            { name: "Sandeep", shifts: ["L","W","W","1","1","1","1","1","W","W","1","1","1","1","L","W","W","1","1","1","1","1","W","W","U","U","U","U"] },
            { name: "Siva", shifts: ["2","W","W","U","U","U","U","3","W","W","2","2","2","G","1","W","W","2","2","2","2","2","W","W","1","1","1","L"] },
            { name: "Vijaya", shifts: ["3","W","W","2","2","2","2","2","W","1","W","L","2","2","2","W","W","U","U","U","U","U","W","W","2","2","2","2"] }
        ];

        const shiftInfo = {
            'W': { name: 'Week Off', color: 'bg-cyan-200', time: 'Off' },
            'G': { name: 'General', color: 'bg-white', time: '09:00 - 18:15' },
            'U': { name: 'US Shift', color: 'bg-white', time: '18:00 - 03:15' },
            '1': { name: 'Shift 1', color: 'bg-white', time: '06:00 - 15:15' },
            '2': { name: 'Shift 2', color: 'bg-white', time: '14:00 - 23:15' },
            '3': { name: 'Shift 3', color: 'bg-white', time: '22:00 - 07:15' },
            'L': { name: 'Leave', color: 'bg-yellow-200', time: 'Off' },
            'H': { name: 'Holiday', color: 'bg-red-200', time: 'Off' }
        };

        function isWeekend(day) {
            return day % 7 === 0 || day % 7 === 1; // 0-indexed, so 0 and 1 are Saturday and Sunday
        }

        function createSchedule() {
            const thead = document.querySelector('thead tr');
            const tbody = document.getElementById('scheduleBody');
            const daysInFebruary = 28; // Correct number of days in February 2024

            // Create header
            for (let i = 1; i <= daysInFebruary; i++) {
                const th = document.createElement('th');
                th.className = `border border-gray-200 p-1 text-center font-semibold text-gray-900 min-w-[60px] ${isWeekend(i - 1) ? 'bg-red-200' : ''}`;
                const dayAbbr = ['Sa', 'Su', 'M', 'Tu', 'W', 'Th', 'F'][(i - 1) % 7];
                th.innerHTML = `<div class="text-xs text-gray-600 mb-1">${dayAbbr}</div><div class="text-sm">${i}</div>`;
                thead.appendChild(th);
            }

            // Create rows
            schedule.forEach((employee, index) => {
                const tr = document.createElement('tr');
                tr.className = index % 2 === 0 ? 'bg-white' : 'bg-gray-50';

                const nameTd = document.createElement('td');
                nameTd.className = 'border border-gray-200 px-4 py-2 font-medium text-gray-900 sticky left-0 bg-inherit';
                nameTd.textContent = employee.name;
                tr.appendChild(nameTd);

                employee.shifts.forEach((shift, idx) => {
                    const td = document.createElement('td');
                    td.className = `border border-gray-200 p-1 text-center ${isWeekend(idx) ? 'bg-red-200' : ''}`;
                    const span = document.createElement('span');
                    span.className = `inline-block px-2 py-1 rounded-md text-sm font-medium ${shiftInfo[shift]?.color || 'bg-gray-100'}`;
                    span.textContent = shift;
                    span.dataset.shift = shift;
                    td.appendChild(span);
                    tr.appendChild(td);
                });

                tbody.appendChild(tr);
            });
        }

        function createLegend() {
            const legend = document.getElementById('legend');
            Object.entries(shiftInfo).forEach(([shift, info]) => {
                const div = document.createElement('div');
                div.className = 'flex items-center space-x-2';
                div.innerHTML = `
                    <span class="inline-block px-2 py-1 rounded-md text-sm font-medium ${info.color}">${shift}</span>
                    <span class="text-sm text-gray-600">${info.name}</span>
                `;
                legend.appendChild(div);
            });

            const weekendDiv = document.createElement('div');
            weekendDiv.className = 'flex items-center space-x-2';
            weekendDiv.innerHTML = `
                <span class="inline-block px-2 py-1 rounded-md text-sm font-medium bg-red-200">Weekend</span>
            `;
            legend.appendChild(weekendDiv);
        }

        function setupTooltip() {
            const tooltip = document.getElementById('tooltip');
            document.addEventListener('mouseover', (e) => {
                if (e.target.dataset.shift) {
                    const shift = e.target.dataset.shift;
                    const info = shiftInfo[shift];
                    tooltip.textContent = `${info.name}: ${info.time}`;
                    tooltip.style.visibility = 'visible';
                    tooltip.style.left = `${e.pageX + 10}px`;
                    tooltip.style.top = `${e.pageY + 10}px`;
                }
            });

            document.addEventListener('mouseout', (e) => {
                if (e.target.dataset.shift) {
                    tooltip.style.visibility = 'hidden';
                }
            });
        }

        createSchedule();
        createLegend();
        setupTooltip();
    </script>
</body>
</html>
